- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - socat
      - conntrack
      - ipset
    state: present
    update_cache: true

- name: Create Kubernetes directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bin_dir }}", mode: "0755" }
    - { path: "{{ config_dir }}", mode: "0755" }
    - { path: "{{ cert_dir }}", mode: "0755" }
    - { path: "{{ kubelet_config_dir }}", mode: "0755" }
    - { path: "/var/lib/kubernetes", mode: "0755" }

- name: Download containerd archive
  ansible.builtin.get_url:
    url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
    dest: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    mode: "0644"

- name: Extract containerd binaries
  ansible.builtin.unarchive:
    src: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ bin_dir }}/containerd"

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: "{{ containerd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/containerd config default > {{ containerd_config_dir }}/config.toml"
    creates: "{{ containerd_config_dir }}/config.toml"

- name: Configure containerd to use systemd cgroups
  ansible.builtin.replace:
    path: "{{ containerd_config_dir }}/config.toml"
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Download runc binary
  ansible.builtin.get_url:
    url: "https://github.com/opencontainers/runc/releases/download/v1.2.2/runc.amd64"
    dest: "/tmp/runc.amd64"
    mode: "0755"

- name: Install runc
  ansible.builtin.copy:
    src: "/tmp/runc.amd64"
    dest: "{{ bin_dir }}/runc"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Create CNI plugins directory
  ansible.builtin.file:
    path: "/opt/cni/bin"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download CNI plugins archive
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-amd64-v1.6.2.tgz"
    dest: "/tmp/cni-plugins.tgz"
    mode: "0644"

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: "/tmp/cni-plugins.tgz"
    dest: "/opt/cni/bin"
    remote_src: true
    creates: "/opt/cni/bin/bridge"

- name: Install containerd systemd service
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
    dest: "{{ systemd_dir }}/containerd.service"
    mode: "0644"

- name: Reload systemd and enable containerd
  ansible.builtin.systemd:
    name: containerd
    daemon_reload: true
    enabled: true
    state: started

- name: Download Kubernetes worker binaries
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/{{ kubernetes_version }}/bin/linux/amd64/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0755"
  loop:
    - kubelet
    - kubectl

- name: Install Kubernetes worker binaries
  ansible.builtin.copy:
    src: "/tmp/{{ item }}"
    dest: "{{ bin_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - kubelet
    - kubectl

- name: Install Kubernetes CA certificate
  ansible.builtin.copy:
    src: "{{ local_certificate_dir }}/ca.crt"
    dest: "{{ cert_dir }}/ca.crt"
    owner: root
    group: root
    mode: "0644"

- name: Install worker node certificate and key
  ansible.builtin.copy:
    src: "{{ local_certificate_dir }}/{{ item.src }}"
    dest: "{{ cert_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ inventory_hostname }}.crt", dest: "kubelet.crt", mode: "0644" }
    - { src: "{{ inventory_hostname }}.key", dest: "kubelet.key", mode: "0600" }

- name: Install worker kubeconfig
  ansible.builtin.copy:
    src: "{{ local_config_dir }}/{{ inventory_hostname }}.kubeconfig"
    dest: "{{ kubelet_config_dir }}/kubeconfig"
    owner: root
    group: root
    mode: "0600"

- name: Create kubelet static pods directory
  ansible.builtin.file:
    path: "{{ config_dir }}/manifests"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install kubelet configuration
  ansible.builtin.template:
    src: kubelet-config.yaml.j2
    dest: "{{ kubelet_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Install kubelet systemd unit
  ansible.builtin.template:
    src: kubelet.service.j2
    dest: "{{ systemd_dir }}/kubelet.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
