- name: Create kube-proxy configuration directory
  ansible.builtin.file:
    path: /var/lib/kube-proxy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download kube-proxy binary
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/{{ kubernetes_version }}/bin/linux/amd64/kube-proxy"
    dest: "{{ bin_dir }}/kube-proxy"
    owner: root
    group: root
    mode: "0755"

- name: Install kube-proxy kubeconfig
  ansible.builtin.copy:
    src: "{{ local_config_dir }}/kube-proxy.kubeconfig"
    dest: /var/lib/kube-proxy/kubeconfig
    owner: root
    group: root
    mode: "0600"
  notify: Restart kube-proxy

- name: Install kube-proxy configuration
  ansible.builtin.template:
    src: kube-proxy-config.yaml.j2
    dest: /var/lib/kube-proxy/config.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart kube-proxy

- name: Install kube-proxy systemd service
  ansible.builtin.template:
    src: kube-proxy.service.j2
    dest: /etc/systemd/system/kube-proxy.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart kube-proxy

- name: Reload systemd and enable kube-proxy
  ansible.builtin.systemd:
    name: kube-proxy
    daemon_reload: true
    enabled: true
    state: started