- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"

- name: Read admin kubeconfig from control plane
  ansible.builtin.command:
    cmd: "cat {{ config_dir }}/admin.kubeconfig"
  delegate_to: "{{ groups['control_plane'][0] }}"
  vars:
    ansible_connection: ssh
  become: true
  register: admin_kubeconfig_content
  changed_when: false
  no_log: true

- name: Save admin kubeconfig locally
  ansible.builtin.copy:
    content: "{{ admin_kubeconfig_content.stdout }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"

- name: Configure local API Server endpoint
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: "https://{{ control_plane_endpoint | regex_escape }}:{{ kubernetes_api_port }}"
    replace: "https://127.0.0.1:{{ kubernetes_api_port }}"

- name: Set local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"