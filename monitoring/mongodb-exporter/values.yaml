mongodb:
  uri: ""

existingSecret:
  name: mongodb-exporter-uri
  key: mongodb-uri

extraArgs:
  - --collect-all
  - --compatible-mode

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: monitoring
